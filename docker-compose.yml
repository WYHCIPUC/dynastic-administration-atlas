services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必须设置 POSTGRES_PASSWORD（数据库密码），禁止使用默认弱口令}
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - atlas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build:
      context: ./web
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-atlas}?schema=public
      ADMIN_EMAIL: ${ADMIN_EMAIL:?必须设置 ADMIN_EMAIL（管理员登录邮箱）}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?必须设置 ADMIN_PASSWORD_HASH（管理员密码的 argon2id 哈希）}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?必须设置 ADMIN_SESSION_SECRET（随机长会话密钥）}
      AI_EXPLAINER_ENABLED: "false"
      EMBEDDING_ENABLED: "false"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  migrate:
    build:
      context: ./web
      target: tools
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-atlas}?schema=public
    command: ["sh", "-c", "npx prisma migrate deploy && npm run content:import"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  atlas_pgdata:
