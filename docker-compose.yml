services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    ports:
      - "5432:5432"
    volumes:
      - atlas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build:
      context: ./web
    environment:
      DATABASE_URL: postgresql://atlas:atlas@db:5432/atlas?schema=public
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-change-this-session-secret}
      AI_EXPLAINER_ENABLED: "false"
      EMBEDDING_ENABLED: "false"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  migrate:
    build:
      context: ./web
      target: tools
    environment:
      DATABASE_URL: postgresql://atlas:atlas@db:5432/atlas?schema=public
    command: ["sh", "-c", "npx prisma migrate deploy && npm run content:import"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  atlas_pgdata:
